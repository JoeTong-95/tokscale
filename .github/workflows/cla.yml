name: CLA

# Pull requests that change packages/frontend (AGPL-3.0-only) need a one-time
# signature of CLA.md. Signatures are stored on the cla-signatures branch, which
# must exist before this workflow is enabled.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
    paths:
      - "packages/frontend/**"

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The action only reads PR metadata and comments; it never checks out pull request code.
      - name: Check CLA signatures
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/junhoyeo/tokscale/blob/main/CLA.md"
          path-to-signatures: "signatures/cla.json"
          branch: "cla-signatures"
          allowlist: "junhoyeo,*[bot]"
